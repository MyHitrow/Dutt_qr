<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="duttGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7A8FF"/>
      <stop offset="50%" stop-color="#A66CFF"/>
      <stop offset="100%" stop-color="#6B35C2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF78"/>
      <stop offset="100%" stop-color="#E2A63B"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="#120D18"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#duttGrad)" stroke-width="8" opacity="0.4"/>

  <!-- Stylized Elegant Wine Glass / Mezze Crest -->
  <g transform="translate(136, 100)">
    <!-- Mulberry / Grape clusters above the glass -->
    <circle cx="120" cy="50" r="26" fill="url(#duttGrad)"/>
    <circle cx="85" cy="80" r="24" fill="url(#duttGrad)"/>
    <circle cx="155" cy="80" r="24" fill="url(#duttGrad)"/>
    <circle cx="120" cy="110" r="22" fill="url(#goldGrad)"/>
    <circle cx="65" cy="120" r="18" fill="url(#duttGrad)" opacity="0.85"/>
    <circle cx="175" cy="120" r="18" fill="url(#duttGrad)" opacity="0.85"/>

    <!-- Wine / Raki Goblet Stem & Bowl -->
    <path d="M 40 160 C 40 240, 200 240, 200 160 Z" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="120" y1="240" x2="120" y2="330" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="60" y1="330" x2="180" y2="330" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Subtle Golden Shine inside the bowl -->
    <path d="M 65 175 C 75 220, 165 220, 175 175" fill="none" stroke="url(#duttGrad)" stroke-width="8" opacity="0.7"/>
  </g>
</svg>
